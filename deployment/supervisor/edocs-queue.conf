; Supervisor config for CCBRT eDocs queue worker
; Copy to server: sudo cp edocs-queue.conf /etc/supervisor/conf.d/
; Then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start edocs-queue:*

[program:edocs-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/edocs/artisan queue:work --sleep=3 --tries=3 --queue=default,mail
directory=/var/www/edocs
autostart=true
autorestart=true
user=edoc
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/edocs/storage/logs/queue.log
stopwaitsecs=3600
